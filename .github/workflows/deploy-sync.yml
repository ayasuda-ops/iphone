name: Deploy sync worker (Cloudflare)

# 友メシ帳の共有リスト同期サーバーを Cloudflare Workers にデプロイする。
# 必要なリポジトリシークレット（Settings → Secrets and variables → Actions）:
#   CLOUDFLARE_API_TOKEN   「Edit Cloudflare Workers」テンプレートで作成した API トークン
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare のアカウント ID
#   SYNC_KEY               アプリで入力する合言葉

on:
  push:
    branches: [main]
    paths:
      - "sync-worker/**"
      - ".github/workflows/deploy-sync.yml"
  workflow_dispatch:

concurrency:
  group: deploy-sync
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sync-worker
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
        run: |
          missing=""
          [ -z "$CF_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$SYNC_KEY" ] && missing="$missing SYNC_KEY"
          if [ -n "$missing" ]; then
            echo "::error::リポジトリシークレットが未登録です:$missing"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sync-worker/package-lock.json

      - run: npm ci

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: sync-worker
          secrets: |
            SYNC_KEY
        env:
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
