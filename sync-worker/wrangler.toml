# 友メシ帳 共有リスト同期サーバー
# デプロイは GitHub Actions (.github/workflows/deploy-sync.yml) から自動で行います。
# 合言葉 SYNC_KEY は Cloudflare のシークレットとして登録され、このファイルには書きません。
name = "tomomeshi-sync"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
# 同期を許可するアプリの配信元（カンマ区切り）
ALLOWED_ORIGINS = "https://ayasuda-ops.github.io"

[[durable_objects.bindings]]
name = "LIST"
class_name = "SyncList"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncList"]
